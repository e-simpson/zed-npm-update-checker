name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run strict Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Run workspace tests
        run: cargo test --locked --workspace --all-features
      - name: Build native release LSP
        run: cargo build --locked --release --package npm-package-json-checker-lsp
      - name: Build wasm32-wasip2 extension
        run: cargo build --locked --release --package npm-package-json-checker --target wasm32-wasip2

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: npm-package-json-checker-lsp-darwin-arm64.tar.gz
          # macOS Intel
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: npm-package-json-checker-lsp-darwin-amd64.tar.gz
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: npm-package-json-checker-lsp-linux-amd64.tar.gz
          # Linux ARM64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_name: npm-package-json-checker-lsp-linux-arm64.tar.gz
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: npm-package-json-checker-lsp-windows-amd64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build LSP binary
        run: cargo build --locked --release --package npm-package-json-checker-lsp --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.asset_name }} npm-package-json-checker-lsp
          cd ../../..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path npm-package-json-checker-lsp.exe -DestinationPath ../../../${{ matrix.asset_name }}
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            npm-package-json-checker-lsp-darwin-arm64.tar.gz
            npm-package-json-checker-lsp-darwin-amd64.tar.gz
            npm-package-json-checker-lsp-linux-amd64.tar.gz
            npm-package-json-checker-lsp-linux-arm64.tar.gz
            npm-package-json-checker-lsp-windows-amd64.zip
          )
          mapfile -t actual < <(find artifacts -maxdepth 1 -type f -printf '%f\n' | sort)
          ((${#actual[@]} == ${#expected[@]})) || { echo "Expected exactly ${#expected[@]} assets, found ${#actual[@]}"; printf '%s\n' "${actual[@]}"; exit 1; }
          for asset in "${expected[@]}"; do
            [[ -f "artifacts/$asset" ]] || { echo "Missing expected asset: $asset"; exit 1; }
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
